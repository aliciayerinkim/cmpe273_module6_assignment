apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: inventory-app:1.0
          imagePullPolicy: Never
          command: ["python", "client.py"]
          env:
            - name: INVENTORY_URL
              value: "http://inventory:8080/inventory/apple"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
